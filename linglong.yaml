version: '1'

package:
  id: org.deepin.draw
  name: deepin-draw
  version: 6.5.43.1
  kind: app
  description: |
    Draw for deepin os.

command:
  - deepin-draw

base: org.deepin.base/25.2.2
runtime: org.deepin.runtime.dtk/6.7.0

build: |
  # 修改服务使用玲珑启动
  sed -i "s|Exec=/usr/bin/deepin-draw|Exec=deepin-draw|g" com.deepin.Draw.service

  VERSION=$(head -1 debian/changelog | awk -F'[()]' '{print $2}')
  cmake -B build \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_INSTALL_PREFIX=${PREFIX} \
        -DCMAKE_INSTALL_LIBDIR=${PREFIX}/lib/${TRIPLET} \
        -DVERSION=${VERSION}
  cmake --build build -j`nproc`
  cmake --build build --target install >install.log 2>&1

# allow apt download in build and do apt update
buildext:
  apt:
    build_depends:
      - cmake
    depends:
      - deepin-event-log
      - deepin-picker-cli
      - kimageformat6-plugins
      - libheif1
      - libheif-plugin-aomenc
      - libheif-plugin-dav1d
      - libheif-plugin-j2kdec
      - libheif-plugin-libde265
      - libheif-plugin-x265
