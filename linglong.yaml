version: '1'

package:
  id: org.deepin.draw
  name: deepin-draw
  version: 6.5.44.1
  kind: app
  description: |
    Draw for deepin os.

command:
  - deepin-draw

base: org.deepin.base/25.2.2
runtime: org.deepin.runtime.dtk/6.7.0

build: |
  # 修改服务使用玲珑启动
  sed -i "s|Exec=/usr/bin/deepin-draw|Exec=deepin-draw|g" com.deepin.Draw.service

  # depends 里的包会解包到 $PREFIX/lib/... 而非 $PREFIX/bin，Qt 默认不搜索该路径，
  # 需显式加入 QT_PLUGIN_PATH。该文件由玲珑的 /etc/profile.d/linglong.sh 在
  # /runtime/etc/profile 之后 source，此时 QT_PLUGIN_PATH 已指向 /runtime，
  # 故必须追加而非覆盖，否则 dxcb/chameleon 等平台插件会丢失。
  # libheif 1.18 不含内建编解码器，同样指向插件目录。
  mkdir -p $PREFIX/etc
  printf '%s\n' \
    "export QT_PLUGIN_PATH=$PREFIX/lib/${TRIPLET}/qt6/plugins:\$QT_PLUGIN_PATH" \
    "export LIBHEIF_PLUGIN_PATH=$PREFIX/lib/${TRIPLET}/libheif/plugins" \
    > $PREFIX/etc/profile

  VERSION=$(head -1 debian/changelog | awk -F'[()]' '{print $2}')
  cmake -B build \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_INSTALL_PREFIX=${PREFIX} \
        -DCMAKE_INSTALL_LIBDIR=${PREFIX}/lib/${TRIPLET} \
        -DVERSION=${VERSION}
  cmake --build build -j`nproc`
  cmake --build build --target install >install.log 2>&1

buildext:
  apt:
    build_depends:
      - cmake
      - g++
    depends:
      - deepin-event-log
      - kimageformat6-plugins
